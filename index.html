<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Stock – Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b24;--card:rgba(255,255,255,.06);--ink:#e8eefc;--mut:#93a4cc;--line:rgba(140,170,255,.18);--pri:#6ea8ff;--prid:#1d4ed8;--prif:#031030;--soft:rgba(59,130,246,.22);--warn:#fbbf24;--bad:#fb7185;--ok:#34d399;--grad:linear-gradient(90deg,#2f6bff,#22c1f1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}html{min-height:100%}
body{min-height:100vh;background:#050b24 linear-gradient(145deg,#050b24 0%,#0b1d52 55%,#123a8a 135%) fixed;color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:24px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:0 0 18px 18px;box-shadow:0 8px 24px rgba(14,60,160,.4)}header b{font-size:18px;font-weight:800}header small{opacity:.9;display:block;font-size:12px}
nav{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;background:rgba(5,11,36,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:6px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:13px 12px;white-space:nowrap;font:600 14px "Plus Jakarta Sans",system-ui,sans-serif}nav button.on{color:#fff;box-shadow:inset 0 -3px #22c1f1;background:rgba(59,130,246,.15)}
main{padding:14px;max-width:960px;margin:auto}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.07);color:var(--ink);font:inherit;margin:4px 0 8px}
select option{background:#0b1d52;color:#e8eefc}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut)}button{font:inherit;cursor:pointer}
.pri,.ghost,.sm{border-radius:10px;padding:10px 14px;border:1px solid var(--line);font-weight:700}.pri{background:var(--grad);color:var(--prif);border:0}.pri:disabled{opacity:.45}.ghost{background:none;color:#9ec1ff}
.sm{padding:5px 10px;font-size:13px;background:var(--soft);color:#9ec1ff;border-color:transparent}.sm.d{color:var(--bad);background:rgba(251,113,133,.14)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.item{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);display:flex;flex-direction:column;gap:2px}.item:hover{border-color:#22c1f1}.item span{font-size:12px;color:var(--mut)}
.cat{text-align:left;background:linear-gradient(135deg,rgba(47,107,255,.22),rgba(34,193,241,.08));border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}.cat b{display:block;font-size:16px}.cat span{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mut{color:var(--mut)}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:640px){.kpi{grid-template-columns:repeat(3,1fr)}}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.kpi small{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:22px;font-weight:800}.kpi .hi{background:var(--grad);color:var(--prif);border:0}.kpi .hi small{color:inherit;opacity:.8}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:10px 0 24px}.bars div{flex:1;background:linear-gradient(180deg,#22c1f1,#2f6bff);border-radius:6px 6px 0 0;min-height:3px;position:relative}.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.ln{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}.ln:last-child{border:0}
.meter{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--grad)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 13px "Plus Jakarta Sans",system-ui,sans-serif}.chip.on{background:var(--grad);color:var(--prif);border-color:transparent}
h3,h4{margin:6px 0}dialog{border:1px solid var(--line);border-radius:18px;background:#0b1d52;color:var(--ink);width:min(92vw,420px);padding:18px}dialog::backdrop{background:rgba(0,0,0,.6)}
.big{font-size:22px;font-weight:800}.login{max-width:360px;margin:10vh auto;padding:22px}.login h1{margin:0 0 4px;font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#e8eefc;color:#050b24;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.on{opacity:1}
@media print{body>*:not(dialog){display:none!important}dialog{border:0;width:100%;background:#fff;color:#000}.noprint{display:none}}
</style></head><body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),m=n=>'$'+(+n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.alert=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
const iso=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),today=()=>iso(0),KEY='nova_stock_blue_v2';
let db=null,user=null,tab='dash',oc=null,cart=[],q='',pq='',pc='',disc='',paid='',cu='',sv='new',period='today';
const SUP={'Food & Grocery':'Horn Trading','Beverages':'Gulf Supplies','Household':'Gulf Supplies','Electronics':'Nova Imports','Stationery':'Nova Imports','Clothing':'Style Wholesale'};
function seed(){const d={shop:'Nova Stock',cats:['Food & Grocery','Beverages','Household','Electronics','Stationery','Clothing'],products:[],sales:[],orders:[],log:[],nid:1,expenses:[{id:uid(),t:today(),note:'Shop rent',amt:150},{id:uid(),t:today(),note:'Electricity',amt:35}],
customers:[{id:uid(),name:'Ahmed Ali',phone:'0634 000 111',debt:12.5},{id:uid(),name:'Fadumo Hassan',phone:'0634 000 222',debt:0},{id:uid(),name:'Hodan Warsame',phone:'0634 000 333',debt:4.2}],
users:[{id:'u1',name:'Admin',role:'admin',pin:'1234'},{id:'u2',name:'Cashier',role:'cashier',pin:'0000'}]};
[['Rice 25 kg','Food & Grocery',18,22,48,15,300],['Cooking oil 5 L','Food & Grocery',9,11.5,9,12,200],['Sugar 10 kg','Food & Grocery',7.5,9,60,20,25],['Pasta 500 g','Food & Grocery',.7,1.2,90,25,400],['Milk powder 400 g','Food & Grocery',3.2,4.5,35,20,-10],
['Mineral water 1.5 L','Beverages',.3,.6,200,60,270],['Orange juice 1 L','Beverages',.9,1.6,40,30,40],['Soda 330 ml','Beverages',.35,.7,18,48,150],
['Laundry soap bar','Household',.4,.6,120,40,null],['Dish soap 1 L','Household',1.5,2.2,14,15,null],['Bleach 2 L','Household',1.3,2,45,12,null],
['LED bulb 12 W','Electronics',1.1,1.8,6,20,null],['Phone charger','Electronics',3,4.9,31,10,null],['Power bank 10k','Electronics',12,18,11,8,null],['Earphones','Electronics',2,3.5,27,10,null],
['Notebook A4','Stationery',.7,1.1,75,30,null],['Ballpoint pens (box)','Stationery',2.2,3.5,22,10,null],['Printer paper A4 ream','Stationery',3.5,5.2,40,15,null],
['Cotton T-shirt','Clothing',3,6.5,55,15,null],['Socks (3-pack)','Clothing',1.2,2.5,70,20,null]].forEach(a=>d.products.push({id:uid(),name:a[0],cat:a[1],sup:SUP[a[1]],cost:a[2],price:a[3],qty:a[4],min:a[5],exp:a[6]===null?'':iso(a[6]),batch:'B'+(100+Math.floor(Math.random()*900))}));
for(let k=0;k<7;k++)for(let j=0;j<(k?3:4);j++){const items=[];for(let n=0;n<1+Math.floor(Math.random()*3);n++){const p=d.products[Math.floor(Math.random()*d.products.length)];if(p.qty<30||items.find(i=>i.id===p.id))continue;const c=1+Math.floor(Math.random()*4);p.qty-=c;items.push({id:p.id,name:p.name,cat:p.cat,q:c,p:p.price,c:p.cost})}
if(!items.length)continue;const t=items.reduce((s,i)=>s+i.q*i.p,0),dt=new Date(Date.now()-k*864e5);dt.setUTCHours(6+j*3,10+j*7);d.sales.push({id:uid(),t:dt.toISOString(),items,disc:0,total:t,paid:t,cust:'',by:'Cashier'})}
return d}
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.products){db=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const lg=t=>{db.log.unshift({t:new Date().toISOString(),u:user?user.name:'-',msg:t});db.log=db.log.slice(0,100)};
const P=id=>db.products.find(p=>p.id===id),C=id=>db.customers.find(c=>c.id===id),adm=()=>user&&user.role==='admin';
const dleft=p=>p.exp?Math.round((new Date(p.exp)-new Date(today()))/864e5):9999;
const rev=S=>S.reduce((a,s)=>a+s.total,0),prof=S=>S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+(i.p-i.c)*i.q,0)-s.disc,0),onDay=d=>db.sales.filter(s=>s.t.slice(0,10)===d);
const stat=p=>{const d=dleft(p);return d<0?'<span class="tag bad">Expired</span>':d<=60?`<span class="tag warn">Expires in ${d}d</span>`:p.qty<=p.min?'<span class="tag warn">Low stock</span>':'<span class="tag ok">In stock</span>'};
const sub=()=>cart.reduce((s,l)=>s+l.q*P(l.id).price,0),total=()=>Math.max(0,sub()-(+disc||0));
const fdt=t=>new Date(t).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function form(title,fields,cb){const d=$('#dlg');d.innerHTML=`<form method="dialog" id="f"><h3>${title}</h3>${fields.map(f=>f.o?`<label>${f.l}<select name="${f.k}">${f.o.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`:`<label>${f.l}<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" step="any" ${f.r?'required':''}></label>`).join('')}<div class="row"><button value="x" formnovalidate class="ghost">Cancel</button><button class="pri">Save</button></div></form>`;d.showModal();$('#f').onsubmit=e=>{if(e.submitter.value==='x')return;cb(Object.fromEntries(new FormData(e.target)))}}
function show(html){const d=$('#dlg');d.innerHTML=html+'<div class="row noprint" style="margin-top:12px"><button class="ghost" onclick="$(\'#dlg\').close()">Close</button><button class="pri" onclick="print()">Print</button></div>';d.showModal()}
function cf(msg,fn){const d=$('#dlg');d.innerHTML=`<h3>${esc(msg)}</h3><div class="row"><button class="ghost" id="cn">Cancel</button><button class="pri" id="cy">Yes, continue</button></div>`;d.showModal();$('#cn').onclick=()=>d.close();$('#cy').onclick=()=>{d.close();fn()}}
const go=t=>{tab=t;oc=null;render()};
function render(){$('#app').innerHTML=user?shell():`<div class="login card"><h1>${esc(db.shop)}</h1><p class="mut">Stock management system. Sign in to continue.</p><label>User<select id="u">${db.users.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select></label><label>PIN<input id="pin" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')login()"></label><button class="pri" style="width:100%" onclick="login()">Sign in</button><p class="mut" style="font-size:12px">Demo PINs: Admin 1234 · Cashier 0000</p></div>`}
function login(){const u=db.users.find(x=>x.id===$('#u').value);if(u&&$('#pin').value===u.pin){user=u;tab=u.role==='admin'?'dash':'sales';oc=null;lg('Signed in');save();render()}else alert('Incorrect PIN')}
function shell(){const T=adm()?[['dash','Dashboard'],['sales','Sales'],['cats','Categories'],['stock','Stock'],['cust','Customers'],['rep','Reports'],['log','Activity'],['set','Settings']]:[['sales','Sales'],['cats','Products'],['cust','Customers']];
return`<header><div><b>${esc(db.shop)}</b><small>${esc(user.name)} · ${adm()?'Administrator':'Cashier'}</small></div><button class="sm" style="color:#fff;border-color:#fff8" onclick="user=null;cart=[];render()">Sign out</button></header><nav>${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main>${V[tab]()}</main>`}
const V={};
/* ---------- Dashboard ---------- */
V.dash=()=>{const T=today(),S=onDay(T),Y=onDay(iso(-1)),r=rev(S),yr=rev(Y),dl=yr?Math.round((r-yr)/yr*100):null;
const exp=db.products.filter(p=>dleft(p)<=60).sort((a,b)=>dleft(a)-dleft(b)),low=db.products.filter(p=>p.qty<=p.min&&dleft(p)>60);
const days=[...Array(7)].map((_,i)=>{const d=iso(i-6);return[new Date(d).toLocaleDateString('en',{weekday:'short',timeZone:'UTC'}),rev(onDay(d))]}),mx=Math.max(1,...days.map(d=>d[1]));
const top={};db.sales.filter(s=>s.t.slice(0,10)>=iso(-6)).forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
return`<div class="kpi"><div class="hi"><small>Today’s sales</small><b>${m(r)}</b><small>${dl===null?S.length+' orders':(dl>=0?'▲ ':'▼ ')+Math.abs(dl)+'% vs yesterday · '+S.length+' orders'}</small></div>
<div><small>Today’s profit</small><b>${m(prof(S))}</b></div><div><small>Receivables</small><b>${m(db.customers.reduce((a,c)=>a+c.debt,0))}</b></div>
<div><small>Stock value (cost)</small><b>${m(db.products.reduce((a,p)=>a+p.qty*p.cost,0))}</b></div><div><small>Low stock items</small><b style="color:var(--warn)">${db.products.filter(p=>p.qty<=p.min).length}</b></div><div><small>Expired / expiring</small><b style="color:var(--bad)">${exp.length}</b></div></div>
<div class="card"><b>Sales – last 7 days</b><div class="bars">${days.map(d=>`<div style="height:${d[1]/mx*100}%" title="${m(d[1])}"><small>${d[0]}</small></div>`).join('')}</div></div>
<div class="card"><div class="row"><b>Alerts</b><button class="sm" onclick="go('stock')">Open stock control</button></div>${exp.concat(low).slice(0,7).map(p=>`<div class="ln"><span>${esc(p.name)}<br><small class="mut">${esc(p.cat)} · ${p.qty} left</small></span>${stat(p)}</div>`).join('')||'<p class="mut">No alerts. Everything looks healthy.</p>'}</div>
<div class="card"><b>Top sellers (7 days)</b>${tl.map(t=>`<div class="ln"><span>${esc(t[0])}</span><b>${t[1]} units</b></div>`).join('')||'<p class="mut">No sales yet</p>'}</div>
<div class="card"><div class="row"><b>Recent sales</b><button class="sm" onclick="sv='hist';go('sales')">View all</button></div>${[...db.sales].reverse().slice(0,5).map(s=>`<div class="ln" onclick="receipt('${s.id}')"><span>${fdt(s.t)}<br><small class="mut">${esc(s.by)} · ${s.items.length} item(s)</small></span><b>${m(s.total)}</b></div>`).join('')||'<p class="mut">No sales yet</p>'}</div>`};
/* ---------- Sales ---------- */
const resHtml=()=>db.products.filter(p=>p.qty>0&&dleft(p)>=0&&(!pc||p.cat===pc)&&(!q||(p.name+(p.barcode||'')).toLowerCase().includes(q.toLowerCase()))).slice(0,24).map(p=>`<button class="item" onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${m(p.price)} · ${p.qty} in stock</span></button>`).join('')||'<p class="mut">No products found</p>';
V.sales=()=>`<div class="chips"><button class="chip ${sv==='new'?'on':''}" onclick="sv='new';render()">New sale</button><button class="chip ${sv==='hist'?'on':''}" onclick="sv='hist';render()">Sales history</button></div>`+(sv==='hist'?hist():`<div class="chips"><button class="chip ${!pc?'on':''}" onclick="pc='';render()">All</button>${db.cats.map((c,i)=>`<button class="chip ${pc===c?'on':''}" onclick="pc=db.cats[${i}];render()">${esc(c)}</button>`).join('')}</div>
<input id="q" placeholder="Search product or barcode…" value="${esc(q)}" oninput="q=this.value;$('#res').innerHTML=resHtml()"><div id="res" class="grid">${resHtml()}</div>
<div class="card"><b>Current sale</b>${cart.map(l=>{const p=P(l.id);return`<div class="ln"><span>${esc(p.name)}<br><small class="mut">${m(p.price)} each</small></span><span><button class="sm" onclick="qty('${l.id}',-1)">−</button> ${l.q} <button class="sm" onclick="qty('${l.id}',1)">+</button></span><b>${m(l.q*p.price)}</b></div>`}).join('')||'<p class="mut">Cart is empty. Tap a product to add it.</p>'}
<label>Discount ($)<input type="number" step="any" value="${esc(disc)}" onchange="disc=this.value;render()"></label>
<label>Customer (required for credit)<select onchange="cu=this.value;render()"><option value="">Walk-in (cash)</option>${db.customers.map(c=>`<option value="${c.id}" ${cu===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
<label>Amount paid (blank = paid in full)<input type="number" step="any" value="${esc(paid)}" onchange="paid=this.value;render()"></label>
<div class="row"><span class="big">${m(total())}</span><button class="pri" onclick="checkout()" ${cart.length?'':'disabled'}>Complete sale</button></div></div>`);
const hist=()=>[...db.sales].reverse().slice(0,60).map(s=>`<div class="card ln" onclick="receipt('${s.id}')"><span><b>#${s.id}</b> · ${fdt(s.t)}<br><small class="mut">${esc(s.by)} · ${s.items.length} item(s)${s.total>s.paid+.001?' · on credit':''}</small></span><b>${m(s.total)}</b></div>`).join('')||'<p class="mut">No sales yet</p>';
function add(id){const p=P(id),l=cart.find(x=>x.id===id);if(l){if(l.q<p.qty)l.q++}else cart.push({id,q:1});render()}
function qty(id,d){const l=cart.find(x=>x.id===id),p=P(id);l.q=Math.min(p.qty,l.q+d);if(l.q<=0)cart=cart.filter(x=>x!==l);render()}
function checkout(){const t=total(),pd=paid===''?t:+paid;if(pd<t&&!cu)return alert('Select a customer to record the remaining balance as credit');
const items=cart.map(l=>{const p=P(l.id);p.qty-=l.q;return{id:p.id,name:p.name,cat:p.cat,q:l.q,p:p.price,c:p.cost}});
const s={id:uid(),t:new Date().toISOString(),items,disc:+disc||0,total:t,paid:Math.min(pd,t),cust:cu,by:user.name};
if(pd<t)C(cu).debt+=t-pd;db.sales.push(s);lg(`Sale #${s.id} for ${m(t)}`);save();cart=[];disc=paid=cu='';render();receipt(s.id)}
function receipt(id){const s=db.sales.find(x=>x.id===id),c=C(s.cust);show(`<div style="text-align:center"><h3 style="margin:0">${esc(db.shop)}</h3><small class="mut">${new Date(s.t).toLocaleString()} · #${s.id} · ${esc(s.by)}</small></div>${s.items.map(i=>`<div class="ln"><span>${esc(i.name)} ×${i.q}</span><span>${m(i.q*i.p)}</span></div>`).join('')}${s.disc?`<div class="ln"><span>Discount</span><span>−${m(s.disc)}</span></div>`:''}<div class="ln"><b>Total</b><b>${m(s.total)}</b></div><div class="ln"><span>Paid</span><span>${m(s.paid)}</span></div>${s.total>s.paid+.001?`<div class="ln"><span>Balance (${esc(c?c.name:'')})</span><b>${m(s.total-s.paid)}</b></div>`:''}<p style="text-align:center" class="mut">Thank you!</p>`)}
/* ---------- Categories & products ---------- */
V.cats=()=>oc?medView():`<div class="row"><h3>${adm()?'Categories':'Products by category'}</h3>${adm()?'<button class="pri" onclick="newCat()">+ Category</button>':''}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${db.cats.map((c,i)=>{const L=db.products.filter(p=>p.cat===c),w=L.filter(p=>dleft(p)<=60||p.qty<=p.min).length;return`<button class="cat" onclick="oc=db.cats[${i}];render()"><b>${esc(c)}</b><span>${L.length} products${adm()?' · '+m(L.reduce((a,p)=>a+p.qty*p.cost,0)):''}</span><br>${w?`<span class="tag warn">${w} need attention</span>`:'<span class="tag ok">All good</span>'}</button>`}).join('')}</div>`;
function medView(){return`<div class="row"><button class="sm" onclick="oc=null;pq='';render()">← All categories</button>${adm()?`<span><button class="pri" onclick="prod()">+ Product</button> <button class="sm d" onclick="delCat()">Delete</button></span>`:''}</div><h3>${esc(oc)}</h3>
<input placeholder="Search in ${esc(oc)}…" value="${esc(pq)}" oninput="pq=this.value;$('#pl').innerHTML=pl()"><div id="pl">${pl()}</div>`}
function pl(){const L=db.products.filter(p=>p.cat===oc&&(!pq||p.name.toLowerCase().includes(pq.toLowerCase())));return L.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b>${stat(p)}</div><div class="mut" style="font-size:13px">In stock: <b>${p.qty}</b> · Price ${m(p.price)}${adm()?' · Cost '+m(p.cost):''}${p.batch?' · Batch '+esc(p.batch):''}${p.exp?' · Exp '+p.exp:''}${adm()&&p.sup?' · '+esc(p.sup):''}</div><div class="row" style="margin-top:8px">${adm()?`<span><button class="sm" onclick="restock('${p.id}')">+ Stock</button> <button class="sm" onclick="prod('${p.id}')">Edit</button></span><button class="sm d" onclick="delP('${p.id}')">Delete</button>`:`<button class="sm" ${p.qty<1||dleft(p)<0?'disabled':''} onclick="tab='sales';sv='new';add('${p.id}')">Add to sale</button>`}</div></div>`).join('')||'<p class="mut">No products in this category yet.</p>'}
function newCat(){form('New category',[{k:'n',l:'Category name',r:1}],d=>{if(!db.cats.includes(d.n))db.cats.push(d.n);lg('Added category '+d.n);save();render()})}
function delCat(){if(db.products.some(p=>p.cat===oc))return alert('Delete or move the products in this category first.');cf('Delete category “'+oc+'”?',()=>{db.cats=db.cats.filter(c=>c!==oc);oc=null;save();render()})}
function prod(id){const p=id?P(id):{};form(id?'Edit product':'New product',[{k:'name',l:'Name',v:p.name,r:1},{k:'cat',l:'Category',o:db.cats,v:p.cat||oc},{k:'barcode',l:'Barcode',v:p.barcode},{k:'batch',l:'Batch number',v:p.batch},{k:'sup',l:'Supplier',v:p.sup},{k:'cost',l:'Cost price',t:'number',v:p.cost,r:1},{k:'price',l:'Selling price',t:'number',v:p.price,r:1},{k:'qty',l:'Quantity',t:'number',v:p.qty??0,r:1},{k:'min',l:'Low-stock alert level',t:'number',v:p.min??20},{k:'exp',l:'Expiry date',t:'date',v:p.exp}],d=>{const o={...d,cost:+d.cost,price:+d.price,qty:+d.qty,min:+d.min};if(id)Object.assign(p,o);else db.products.push({id:uid(),...o});lg((id?'Edited ':'Added ')+d.name);save();render()})}
function restock(id){const p=P(id);form('Receive stock: '+esc(p.name),[{k:'q',l:'Quantity received',t:'number',r:1},{k:'cost',l:'Unit cost',t:'number',v:p.cost},{k:'sup',l:'Supplier',v:p.sup},{k:'batch',l:'New batch number',v:p.batch},{k:'exp',l:'Expiry date of new batch',t:'date',v:p.exp}],d=>{p.qty+=+d.q;p.cost=+d.cost||p.cost;p.sup=d.sup;p.batch=d.batch;if(d.exp)p.exp=d.exp;lg(`Received ${d.q} × ${p.name}`);save();render()})}
function delP(id){const p=P(id);cf('Delete “'+p.name+'”?',()=>{db.products=db.products.filter(x=>x!==p);lg('Deleted '+p.name);save();render()})}
/* ---------- Stock control (expiry, reorder, purchasing) ---------- */
V.stock=()=>{const units={};db.sales.filter(s=>s.t.slice(0,10)>=iso(-6)).forEach(s=>s.items.forEach(i=>units[i.id]=(units[i.id]||0)+i.q));
const ex=db.products.filter(p=>p.qty>0&&dleft(p)<=90).sort((a,b)=>dleft(a)-dleft(b)),need=db.products.filter(p=>p.qty<=p.min&&dleft(p)>=0),loss=ex.filter(p=>dleft(p)<0).reduce((a,p)=>a+p.qty*p.cost,0);
return`<div class="kpi"><div class="hi"><small>Expired stock value</small><b>${m(loss)}</b></div><div><small>Expiring within 90 days</small><b style="color:var(--warn)">${ex.filter(p=>dleft(p)>=0).length}</b></div><div><small>To reorder</small><b>${need.length}</b></div></div>
<div class="card"><b>Expiry watch</b>${ex.map(p=>`<div class="ln"><span>${esc(p.name)}<br><small class="mut">Batch ${esc(p.batch||'–')} · ${p.exp} · ${p.qty} units (${m(p.qty*p.cost)})</small></span><span style="text-align:right">${stat(p)}${dleft(p)<0?`<br><button class="sm d" onclick="wo('${p.id}')">Write off</button>`:''}</span></div>`).join('')||'<p class="mut">Nothing is expiring in the next 90 days.</p>'}</div>
<div class="card"><div class="row"><b>Reorder suggestions</b><button class="sm" onclick="draft()">Draft purchase orders</button></div>${need.map(p=>{const a=(units[p.id]||0)/7;return`<div class="ln"><span>${esc(p.name)}<br><small class="mut">${p.qty} left · level ${p.min} · ${a?'about '+Math.round(p.qty/a)+' days of cover':'no recent sales'} · ${esc(p.sup||'No supplier')}</small></span><b>Order ${Math.max(1,p.min*2-p.qty)}</b></div>`}).join('')||'<p class="mut">All products are above their alert level.</p>'}</div>
<div class="card"><b>Purchase orders</b>${db.orders.map(o=>`<div class="ln"><span><b>${o.id}</b> · ${esc(o.sup)}<br><small class="mut">${o.items.map(i=>i.q+' × '+esc(P(i.id)?P(i.id).name:'Removed')).join(', ')}<br>${fdt(o.t)} · est. ${m(o.items.reduce((a,i)=>a+(P(i.id)?P(i.id).cost*i.q:0),0))}</small></span>${o.status==='Pending'?`<button class="sm" onclick="recvO('${o.id}')">Receive</button>`:'<span class="tag ok">Received</span>'}</div>`).join('')||'<p class="mut">No purchase orders yet.</p>'}</div>`};
function wo(id){const p=P(id);cf(`Write off ${p.qty} × ${p.name} (${m(p.qty*p.cost)})?`,()=>{lg(`Wrote off ${p.qty} × ${p.name} (expired)`);p.qty=0;save();render()})}
function draft(){const by={};db.products.filter(p=>p.qty<=p.min&&dleft(p)>=0&&!db.orders.some(o=>o.status==='Pending'&&o.items.some(i=>i.id===p.id))).forEach(p=>(by[p.sup||'No supplier']=by[p.sup||'No supplier']||[]).push({id:p.id,q:Math.max(1,p.min*2-p.qty)}));
const k=Object.keys(by);k.forEach(s=>{const id='PO-'+db.nid++;db.orders.unshift({id,sup:s,items:by[s],status:'Pending',t:new Date().toISOString()});lg(`Drafted ${id} for ${s}`)});save();render();alert(k.length?k.length+' purchase order(s) drafted':'Nothing new to order')}
function recvO(id){const o=db.orders.find(x=>x.id===id);form('Receive '+id,[{k:'exp',l:'Expiry date of the new stock',t:'date',v:iso(365),r:1}],d=>{o.items.forEach(i=>{const p=P(i.id);if(p){p.qty+=i.q;p.batch=id;p.exp=d.exp}});o.status='Received';lg('Received '+id);save();render()})}
/* ---------- Customers ---------- */
V.cust=()=>`<div class="row"><b>Receivables: ${m(db.customers.reduce((s,c)=>s+c.debt,0))}</b><button class="pri" onclick="newC()">+ Customer</button></div><div style="height:8px"></div>${db.customers.map(c=>`<div class="card row"><span><b>${esc(c.name)}</b><br><small class="mut">${esc(c.phone||'')}</small></span><span style="text-align:right"><b style="color:${c.debt>0?'var(--bad)':'var(--ok)'}">${m(c.debt)}</b><br>${c.debt>0?`<button class="sm" onclick="pay('${c.id}')">Record payment</button>`:'<small class="mut">No balance</small>'}</span></div>`).join('')||'<p class="mut">No customers yet</p>'}`;
function newC(){form('New customer',[{k:'name',l:'Full name',r:1},{k:'phone',l:'Phone'},{k:'debt',l:'Opening balance owed ($, optional)',t:'number'}],d=>{db.customers.push({id:uid(),name:d.name,phone:d.phone,debt:+d.debt||0});save();render()})}
function pay(id){const c=C(id);form('Payment from '+esc(c.name),[{k:'a',l:'Amount received',t:'number',v:c.debt,r:1}],d=>{c.debt=Math.max(0,c.debt-+d.a);lg(`Payment ${m(d.a)} from ${c.name}`);save();render()})}
/* ---------- Reports ---------- */
V.rep=()=>{const inP=t=>period==='all'||(period==='today'?t.slice(0,10)===today():t.slice(0,7)===today().slice(0,7));const S=db.sales.filter(s=>inP(s.t)),E=db.expenses.filter(e=>inP(e.t)),ex=E.reduce((a,e)=>a+e.amt,0),gp=prof(S);
const bc={};S.forEach(s=>s.items.forEach(i=>bc[i.cat||'Other']=(bc[i.cat||'Other']||0)+i.q*i.p));const cl=Object.entries(bc).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...cl.map(c=>c[1]));
return`<select onchange="period=this.value;render()"><option value="today" ${period==='today'?'selected':''}>Today</option><option value="month" ${period==='month'?'selected':''}>This month</option><option value="all" ${period==='all'?'selected':''}>All time</option></select>
<div class="kpi"><div class="hi"><small>Revenue</small><b>${m(rev(S))}</b></div><div><small>Gross profit</small><b>${m(gp)}</b></div><div><small>Expenses</small><b>${m(ex)}</b></div><div><small>Net profit</small><b style="color:${gp-ex>=0?'var(--ok)':'var(--bad)'}">${m(gp-ex)}</b></div></div>
<div class="card"><b>Revenue by category</b>${cl.map(c=>`<div style="margin-top:8px"><div class="row"><span>${esc(c[0])}</span><b>${m(c[1])}</b></div><div class="meter"><i style="width:${c[1]/mx*100}%"></i></div></div>`).join('')||'<p class="mut">No sales in this period</p>'}</div>
<div class="card"><div class="row"><b>Expenses</b><button class="sm" onclick="newE()">+ Expense</button></div>${[...E].reverse().map(e=>`<div class="ln"><span>${esc(e.note)}<br><small class="mut">${e.t}</small></span><b>${m(e.amt)}</b></div>`).join('')||'<p class="mut">No expenses in this period</p>'}</div>`};
function newE(){form('New expense',[{k:'note',l:'Description (rent, salary, electricity…)',r:1},{k:'amt',l:'Amount',t:'number',r:1}],d=>{db.expenses.push({id:uid(),t:today(),note:d.note,amt:+d.amt});save();render()})}
/* ---------- Activity & settings ---------- */
V.log=()=>`<div class="card"><b>Activity log</b>${db.log.map(l=>`<div class="ln"><span>${esc(l.msg)}<br><small class="mut">${esc(l.u)}</small></span><small class="mut">${fdt(l.t)}</small></div>`).join('')||'<p class="mut">No activity yet.</p>'}</div>`;
V.set=()=>`<div class="card"><label>Business name<input id="sn" value="${esc(db.shop)}"></label><button class="pri" onclick="db.shop=$('#sn').value;save();render()">Save</button></div>
<div class="card"><div class="row"><b>Staff accounts</b><button class="sm" onclick="newU()">+ Staff</button></div>${db.users.map(u=>`<div class="ln"><span>${esc(u.name)} <small class="mut">(${u.role})</small></span><span><button class="sm" onclick="pinU('${u.id}')">Change PIN</button>${u.id!==user.id?` <button class="sm d" onclick="delU('${u.id}')">Remove</button>`:''}</span></div>`).join('')}</div>
<div class="card"><b>Backup & restore</b><p class="mut" style="font-size:13px">Copy this text to keep a backup. Paste a backup here and press Restore to load it.</p><textarea id="bk" rows="4">${esc(JSON.stringify(db))}</textarea><button class="ghost" onclick="restore()">Restore</button></div>
<div class="card"><button class="sm d" onclick="cf('Reset everything to the sample data?',resetAll)">Reset to sample data</button></div>`;
function resetAll(){try{localStorage.removeItem(KEY)}catch(e){}db=seed();user=null;render()}
function newU(){form('New staff account',[{k:'name',l:'Name',r:1},{k:'role',l:'Role',o:['cashier','admin']},{k:'pin',l:'PIN (4+ digits)',r:1}],d=>{db.users.push({id:uid(),...d});lg('Added user '+d.name);save();render()})}
function pinU(id){const u=db.users.find(x=>x.id===id);form('New PIN for '+esc(u.name),[{k:'pin',l:'PIN',r:1}],d=>{u.pin=d.pin;save();render()})}
function delU(id){const u=db.users.find(x=>x.id===id);cf('Remove '+u.name+'?',()=>{db.users=db.users.filter(x=>x.id!==id);lg('Removed user '+u.name);save();render()})}
function restore(){try{const d=JSON.parse($('#bk').value);if(!d.products||!d.users)throw 0;d.orders=d.orders||[];d.log=d.log||[];d.nid=d.nid||1;db=d;save();render()}catch(e){alert('That backup text is not valid')}}
render();
</script></body></html>
